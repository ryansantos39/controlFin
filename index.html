<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Financeiro</title>
<meta name="theme-color" content="#065f46">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23065f46'/%3E%3Cpath d='M9 21l5-5 4 3 6-8' stroke='%2334d399' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f7f5; --surface:#ffffff; --surface-2:#eef3f0; --line:#dce5df; --fg:#14231c; --muted:#5d7066;
  --primary:#047857; --primary-strong:#065f46; --primary-soft:#d1fae5; --on-primary:#ffffff;
  --receita:#059669; --despesa:#d97706; --invest:#0284c7; --danger:#b91c1c; --danger-soft:#fee2e2; --warn-soft:#fef3c7;
  --radius:12px; --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1411; --surface:#131e19; --surface-2:#1a2822; --line:#26362e; --fg:#e5efe9; --muted:#8fa49a;
  --primary:#10b981; --primary-strong:#34d399; --primary-soft:#0f3b2c; --on-primary:#04140d;
  --receita:#34d399; --despesa:#fbbf24; --invest:#38bdf8; --danger:#f87171; --danger-soft:#3b1414; --warn-soft:#3a2e0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1411; --surface:#131e19; --surface-2:#1a2822; --line:#26362e; --fg:#e5efe9; --muted:#8fa49a;
  --primary:#10b981; --primary-strong:#34d399; --primary-soft:#0f3b2c; --on-primary:#04140d;
  --receita:#34d399; --despesa:#fbbf24; --invest:#38bdf8; --danger:#f87171; --danger-soft:#3b1414; --warn-soft:#3a2e0c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* topo */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-row{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand svg{width:28px;height:28px}
.top-row .spacer{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--primary-strong);border-bottom-color:var(--primary)}
.yearpill{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:2px}
.yearpill button{border:0;background:none;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted)}
.yearpill button:hover{background:var(--line)}
.yearpill strong{min-width:44px;text-align:center}

main{padding-block:20px 96px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 12px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.head .spacer{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:980px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{background:var(--primary-soft);border-color:transparent}
.neg{color:var(--danger)!important}

/* controles */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:16px;height:16px;display:block}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.monthsel{width:auto;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--surface-2);font-weight:700}
tr.tot td{font-weight:800;border-top:2px solid var(--line)}
td.first,th.first{position:sticky;left:0;background:inherit;z-index:1}
tbody tr{background:var(--surface)}
tbody tr.grp{background:var(--surface-2)}
td.over{background:var(--danger-soft);color:var(--danger);font-weight:700}
td.zero{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.receita{background:color-mix(in srgb,var(--receita) 15%,transparent);color:var(--receita)}
.tag.despesa{background:color-mix(in srgb,var(--despesa) 15%,transparent);color:var(--despesa)}
.tag.terceiros{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.tag.investimento{background:color-mix(in srgb,var(--invest) 15%,transparent);color:var(--invest)}

/* lista de lançamentos */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-weight:800;text-align:right}
.item .v .m{font-weight:500}
.item>div{min-width:0}
.day{padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}

/* barras orçamento */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar-row .top b{font-weight:700}
.track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--primary);border-radius:99px}
.fill.warn{background:var(--despesa)}
.fill.over{background:var(--danger)}

.chart-box{position:relative;height:260px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.alert{padding:10px 14px;border-radius:10px;background:var(--warn-soft);font-size:13px;margin-bottom:16px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.login .card{width:100%;max-width:380px;padding:28px}
.login .brand{margin-bottom:20px;font-size:18px}
.login form{display:flex;flex-direction:column;gap:12px}
.login .msg{font-size:13px;min-height:18px}
.link{border:0;background:none;color:var(--primary-strong);font-weight:700;cursor:pointer;padding:0}

/* modal */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(5,15,10,.5)}
dialog form{padding:20px}
dialog .actions{display:flex;gap:8px;margin-top:18px;align-items:center}
dialog .actions .spacer{flex:1}
.preview{margin-top:12px;padding:10px 12px;background:var(--surface-2);border-radius:10px;font-size:13px}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right) + 20px));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);box-shadow:0 8px 24px rgba(4,120,87,.35);cursor:pointer;display:grid;place-items:center;z-index:30}
.fab svg{width:26px;height:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;max-width:calc(100vw - 32px)}
.inline-input{padding:5px 8px;border-radius:8px;width:110px}
.inline-input.w-l{width:170px}
.inline-input.w-s{width:64px}
.cb{--c:#64748b;display:inline-grid;place-items:center;flex:none;width:34px;height:24px;border-radius:6px;background:var(--c);color:#fff;font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;overflow:hidden}
.cb.dark{color:#111}
.cb:not(.av){padding-left:9px}
.cb.sm:not(.av){padding-left:7px}
.cb::after{content:"";position:absolute;left:4px;top:5px;width:7px;height:5px;border-radius:1.5px;background:rgba(255,255,255,.55)}
.cb.av{border-radius:50%;width:24px}
.cb.av::after{display:none}
.cb.sm{width:26px;height:18px;font-size:8px}.cb.sm::after{left:3px;top:3px;width:5px;height:4px}
.cb.sm.av{width:18px}
.who-f{display:inline-flex;align-items:center;gap:8px}
.lead{display:flex;gap:12px;align-items:center;min-width:0}
.lead>div{min-width:0}
input[type=color]{width:36px;height:30px;padding:2px;border-radius:8px;cursor:pointer}
.acc{cursor:pointer;display:flex;flex-direction:column;gap:6px}
.acc[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.acc .val{font-size:20px;font-weight:800;letter-spacing:-.02em}
.acc .st{font-size:12px}
.ok{color:var(--receita)}
.g-acc{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.orc-in{width:92px;text-align:right}
.orc-in.own{color:var(--primary-strong);font-weight:700}
.ext .item{grid-template-columns:1fr auto auto}
.ext .sal{min-width:96px;text-align:right;color:var(--muted);font-size:12px}
.ext .fut{opacity:.55}
.ext .conc{background:var(--primary-soft)}
.ext .conc.bad{background:var(--danger-soft)}
.pos{color:var(--receita)}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
@media (max-width:560px){.item .tag{display:none}.form-grid{grid-template-columns:1fr}.top-row .who{display:none}h1{font-size:19px}}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="card">
    <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#065f46"/><path d="M9 21l5-5 4 3 6-8" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Controle Financeiro</div>
    <form id="loginForm">
      <label class="f">E-mail<input id="lgEmail" type="email" autocomplete="email" required></label>
      <label class="f">Senha<input id="lgPass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn primary" type="submit" id="lgBtn">Entrar</button>
      <div class="msg muted" id="lgMsg"></div>
      <div class="small muted"><span id="lgSwitchTxt">Primeira vez aqui?</span> <button type="button" class="link" id="lgSwitch">Criar conta</button></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#065f46"/><path d="M9 21l5-5 4 3 6-8" stroke="#34d399" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Controle Financeiro</span></div>
        <div class="spacer"></div>
        <div class="yearpill" title="Ano">
          <button id="yPrev" aria-label="Ano anterior">‹</button><strong id="yLabel">2027</strong><button id="yNext" aria-label="Próximo ano">›</button>
        </div>
        <span class="who small muted" id="who"></span>
        <button class="icon-btn" id="logout" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
      <nav class="tabs" id="tabs">
        <button data-v="painel">Painel</button>
        <button data-v="lancamentos">Lançamentos</button>
        <button data-v="fixos">Fixos</button>
        <button data-v="resumo">Resumo</button>
        <button data-v="cartoes">Cartões</button>
        <button data-v="contas">Contas</button>
        <button data-v="config">Configurações</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="view"><div class="loading">Carregando…</div></main>
  <button class="fab" id="fab" title="Novo lançamento" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
const SUPABASE_URL = "https://djsynxwiiqbaanwzhpcy.supabase.co";
const SUPABASE_KEY = "sb_publishable_OkcNEhfTPRR6H-AlWRPpbA_O7ApFaHh";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const M3 = MESES.map(m => m.slice(0,3));
const TIPO_LABEL = {receita:"Receita", despesa:"Despesa", investimento:"Investimento", terceiros:"Terceiros"};
const fmt = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl = v => fmt.format(v || 0);
const pct = v => (v==null||!isFinite(v)) ? "–" : (v*100).toFixed(1).replace(".",",")+"%";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const parseNum = s => { if (typeof s === "number") return s; s = String(s||"").trim().replace(/\s|R\$/g,""); if (!s) return null; if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const n = Number(s); return isFinite(n) ? n : null; };
const numIn = v => v==null ? "" : String(v).replace(".",",");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

const S = { contas:[], transf:[], concs:[], fixosAll:[], contaSel:null, mesExt:null, user:null, cfg:null, ano:2027, cats:[], formas:[], lanc:[], fixos:[], view:"painel", mes:null, charts:[], filtroMes:null, busca:"" };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function fail(e){ console.error(e); toast("Não foi possível salvar: " + (e.message||e)); }

/* ---------- auth ---------- */
let signup=false;
$("#lgSwitch").onclick = () => { signup=!signup; $("#lgBtn").textContent = signup?"Criar conta":"Entrar"; $("#lgSwitch").textContent = signup?"Entrar":"Criar conta"; $("#lgSwitchTxt").textContent = signup?"Já tem conta?":"Primeira vez aqui?"; $("#lgPass").autocomplete = signup?"new-password":"current-password"; $("#lgMsg").textContent=""; };
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); const email=$("#lgEmail").value.trim(), password=$("#lgPass").value; const msg=$("#lgMsg"); $("#lgBtn").disabled=true; msg.textContent="Aguarde…";
  try{
    if (signup){
      const {data,error} = await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
      if (error) throw error;
      msg.textContent = data.session ? "" : "Conta criada. Abra o e-mail de confirmação e depois entre aqui.";
    } else {
      const {error} = await sb.auth.signInWithPassword({email,password}); if (error) throw error; msg.textContent="";
    }
  }catch(err){ msg.textContent = err.message==="Invalid login credentials" ? "E-mail ou senha incorretos." : err.message; }
  $("#lgBtn").disabled=false;
};
$("#logout").onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((ev, session) => {
  const u = session?.user || null;
  if (u && (!S.user || S.user.id!==u.id)) { S.user=u; $("#login").hidden=true; $("#app").hidden=false; $("#who").textContent=u.email; loadAll(); }
  if (!u) { S.user=null; $("#app").hidden=true; $("#login").hidden=false; }
});

/* ---------- dados ---------- */
async function fetchAll(table, build){
  let out=[], from=0; const step=1000;
  for(;;){ const {data,error} = await build(sb.from(table).select("*")).range(from, from+step-1); if (error) throw error; out=out.concat(data); if (data.length<step) break; from+=step; }
  return out;
}
async function loadAll(){
  $("#view").innerHTML='<div class="loading">Carregando…</div>';
  try{
    let {data:cfg, error} = await sb.from("config").select("*").maybeSingle(); if (error) throw error;
    if (!cfg){ const r = await sb.from("config").insert({}).select().single(); if (r.error) throw r.error; cfg=r.data; }
    S.cfg=cfg; S.ano=cfg.ano;
    const [cats, formas, contas] = await Promise.all([
      fetchAll("categorias", q=>q.order("ordem").order("id")),
      fetchAll("formas", q=>q.order("ordem").order("id")),
      fetchAll("contas", q=>q.order("ordem").order("id")),
    ]);
    S.cats=cats; S.formas=formas; S.contas=contas;
    await loadYear();
  }catch(e){ $("#view").innerHTML=`<div class="empty">Erro ao carregar: ${esc(e.message)}</div>`; }
}
async function loadYear(){
  const [lanc, fixos, transf, concs, orcs] = await Promise.all([
    fetchAll("lancamentos", q=>q.order("data",{ascending:false}).order("id",{ascending:false})),
    fetchAll("fixos", q=>q.order("id")),
    fetchAll("transferencias", q=>q.order("data").order("id")),
    fetchAll("conciliacoes", q=>q.order("data").order("id")),
    fetchAll("orcamentos", q=>q.eq("ano",S.ano)),
  ]);
  S.lanc=lanc; S.fixosAll=fixos; S.transf=transf; S.concs=concs; S.orcs=orcs; syncFixos();
  $("#yLabel").textContent=S.ano;
  if (S.mes==null){ const d=new Date(); S.mes = d.getFullYear()===S.ano ? d.getMonth()+1 : 1; }
  render();
}
function syncFixos(){ S.fixos=S.fixosAll.filter(f=>f.ano===S.ano); }
async function setAno(a){ S.ano=a; S.mes=null; S.filtroMes=null; await sb.from("config").update({ano:a,updated_at:new Date().toISOString()}).eq("user_id",S.user.id); S.cfg.ano=a; $("#view").innerHTML='<div class="loading">Carregando…</div>'; await loadYear(); }
$("#yPrev").onclick=()=>setAno(S.ano-1); $("#yNext").onclick=()=>setAno(S.ano+1);

const catById = id => S.cats.find(c=>c.id===id);
/* orçamento do mês: valor específico do mês, senão o padrão da categoria */
function orcMes(c,m){ const o=(S.orcs||[]).find(x=>x.categoria_id===c.id && x.ano===S.ano && x.mes===m); if (o) return Number(o.valor); return c.orcamento==null?null:Number(c.orcamento); }
const PALETA=["#0f766e","#b45309","#7c3aed","#be123c","#1d4ed8","#4d7c0f","#c2410c","#0e7490","#a21caf","#475569"];
function corForma(f){ if (!f) return "#94a3b8"; if (f.cor) return f.cor; return PALETA[(S.formas.indexOf(f)+PALETA.length)%PALETA.length]; }
function iniciais(n){ const w=String(n||"?").trim().split(/\s+/).filter(Boolean); return (w.length>1? w[0][0]+w[1][0] : w[0].slice(0,2)).toUpperCase(); }
function claro(hex){ const n=parseInt(hex.slice(1),16), r=n>>16&255,g=n>>8&255,b=n&255; return (0.299*r+0.587*g+0.114*b)>165; }
function badge(f,sm){ if (!f) return `<span class="cb av ${sm?"sm":""}" style="--c:#94a3b8" title="Sem forma">–</span>`; const c=corForma(f); return `<span class="cb ${f.tipo==="cartao"?"":"av"} ${sm?"sm":""} ${claro(c)?"dark":""}" style="--c:${c}" title="${esc(f.nome)}" aria-hidden="true">${esc(iniciais(f.nome))}</span>`; }
const formaTag = (f,sm) => `<span class="who-f">${badge(f,sm)}${esc(f?.nome||"—")}</span>`;
const formaById = id => S.formas.find(f=>f.id===id);

/* mês (1..12 relativo ao ano; pode sair do intervalo) em que a 1ª parcela é cobrada */
function absCobranca(l){
  const [y,m,d] = l.data.split("-").map(Number);
  let a = y*12 + (m-1);
  const f = formaById(l.forma_id);
  if (f && f.tipo==="cartao"){
    if (f.fechamento==null) a += 1;
    else a += (d>f.fechamento?1:0) + ((f.vencimento??0) <= f.fechamento ? 1 : 0);
  }
  return a;
}
function idxCobranca(l){ return absCobranca(l) - S.ano*12 + 1; }
function nomeIdx(i){ if (i>=1&&i<=12) return MESES[i-1]+(""); const y=S.ano+Math.floor((i-1)/12); const m=((i-1)%12+12)%12; return M3[m]+"/"+y; }

/* distribui tudo em meses: retorna lista de {mes, valor, cat, forma, origem, ref} */
function movimentos(){
  const out=[];
  for (const l of S.lanc){
    const n=Math.max(1,l.parcelas||1), i0=idxCobranca(l), v=Number(l.valor)/n;
    for (let k=0;k<n;k++){ const m=i0+k; if (m>=1&&m<=12) out.push({mes:m, valor:v, cat:l.categoria_id, forma:l.forma_id, origem:"l", ref:l, parcela:n>1?`${k+1}/${n}`:""}); }
  }
  for (const f of S.fixos){
    for (let m=f.mes_inicio;m<=f.mes_fim;m++) out.push({mes:m, valor:Number(f.valor), cat:f.categoria_id, forma:f.forma_id, origem:"f", ref:f, parcela:""});
  }
  return out;
}
function agregados(){
  const mv=movimentos();
  const porCat={}, porForma={}, tipoMes={receita:Array(13).fill(0),despesa:Array(13).fill(0),investimento:Array(13).fill(0),terceiros:Array(13).fill(0)};
  for (const x of mv){
    const c=catById(x.cat); if (!c) continue;
    (porCat[c.id] ||= Array(13).fill(0))[x.mes]+=x.valor;
    (tipoMes[c.tipo]||tipoMes.despesa)[x.mes]+=x.valor;
    if (c.tipo!=="receita" && x.forma!=null) (porForma[x.forma] ||= Array(13).fill(0))[x.mes]+=x.valor;
  }
  const res=Array(13).fill(0), saldo=Array(13).fill(0);
  let acc=Number(S.cfg.saldo_inicial||0);
  for (let m=1;m<=12;m++){ res[m]=tipoMes.receita[m]-tipoMes.despesa[m]-tipoMes.investimento[m]; acc+=res[m]; saldo[m]=acc; }
  return {mv,porCat,porForma,tipoMes,res,saldo};
}
function grupos(){ const g=[]; for (const c of S.cats) if (!g.includes(c.grupo)) g.push(c.grupo); return g; }
const sum = a => a.reduce((s,v)=>s+v,0);

/* ---------- navegação ---------- */
function go(v){ S.view=v; try{localStorage.setItem("cf.view",v)}catch(e){} render(); window.scrollTo({top:0}); }
$("#tabs").onclick = e => { const b=e.target.closest("button"); if (b) go(b.dataset.v); };
try{ const v=localStorage.getItem("cf.view"); if (v) S.view=v; }catch(e){}
$("#fab").onclick = () => editLanc(null);

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.v===S.view?"page":"false"));
  S.charts.forEach(c=>c.destroy()); S.charts=[];
  const V={painel,lancamentos,fixos,resumo,cartoes,contas,config}[S.view] || painel;
  V();
}
function monthChips(sel, allowAll){
  return `<div class="chips" id="chips">${allowAll?`<button class="chip" data-m="" aria-pressed="${sel==null}">Todos</button>`:""}${M3.map((m,i)=>`<button class="chip" data-m="${i+1}" aria-pressed="${sel===i+1}">${m}</button>`).join("")}</div>`;
}
function bindChips(cb){ $("#chips").onclick=e=>{const b=e.target.closest(".chip"); if(b) cb(b.dataset.m?Number(b.dataset.m):null);}; const a=$("#chips .chip[aria-pressed='true']"); a&&a.scrollIntoView({block:"nearest",inline:"center"}); }

/* ---------- Painel ---------- */
function painel(){
  const A=agregados(), m=S.mes;
  const rec=A.tipoMes.receita[m], des=A.tipoMes.despesa[m], inv=A.tipoMes.investimento[m], res=A.res[m];
  const tx = rec ? (rec-des)/rec : null;
  const recA=sum(A.tipoMes.receita), desA=sum(A.tipoMes.despesa), invA=sum(A.tipoMes.investimento);
  const semFech = S.formas.some(f=>f.tipo==="cartao" && f.fechamento==null);
  const gs=grupos().filter(g=>S.cats.some(c=>c.grupo===g && (c.tipo==="despesa"||c.tipo==="investimento")));
  const rows=gs.map(g=>{ const cs=S.cats.filter(c=>c.grupo===g); const orc=sum(cs.map(c=>orcMes(c,m)||0)); const real=sum(cs.map(c=>(A.porCat[c.id]||[])[m]||0)); return {g,orc,real}; }).filter(r=>r.orc||r.real);
  const top = Object.entries(A.porCat).map(([id,a])=>({c:catById(Number(id)),v:a[m]})).filter(x=>x.c&&x.c.tipo==="despesa"&&x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
  $("#view").innerHTML = `
  <div class="head"><h1>${MESES[m-1]} de ${S.ano}</h1></div>
  ${monthChips(m,false)}
  ${semFech?`<div class="alert" style="margin-top:12px">Preencha o dia de fechamento dos cartões em <button class="link" data-go="config">Configurações</button> para cada compra cair na fatura certa. Até lá, toda compra no cartão conta no mês seguinte.</div>`:""}
  <div class="grid g-kpi" style="margin-top:12px">
    ${kpi("Receitas",brl(rec),"No ano: "+brl(recA))}
    ${kpi("Despesas",brl(des),"No ano: "+brl(desA))}
    ${kpi("Investido",brl(inv),"No ano: "+brl(invA))}
    ${kpi("Sobrou",brl(res),"No ano: "+brl(recA-desA-invA),res<0,true)}
    ${kpi("Taxa de poupança",pct(tx),"No ano: "+pct(recA?(recA-desA)/recA:null))}
    ${kpi("Saldo acumulado",brl(A.saldo[m]),"Início do ano: "+brl(S.cfg.saldo_inicial),A.saldo[m]<0)}
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Orçado x gasto no mês</h2>
      ${rows.length?`<div class="bars">${rows.map(r=>{const p=r.orc?r.real/r.orc:null; const cls=p==null?"":p>1?"over":p>.85?"warn":""; return `<div class="bar-row"><div class="top"><b>${esc(r.g)}</b><span>${brl(r.real)} <span class="muted">/ ${r.orc?brl(r.orc):"sem orçamento"}</span></span></div><div class="track"><div class="fill ${cls}" style="width:${p==null?0:Math.min(100,p*100)}%"></div></div>${p!=null&&p>1?`<div class="small neg" style="margin-top:4px">Passou ${brl(r.real-r.orc)}</div>`:""}</div>`;}).join("")}</div>`:`<div class="empty">Nenhum gasto neste mês ainda.</div>`}
    </div>
    <div class="card"><h2>Onde mais gastou</h2>
      ${top.length?`<div class="bars">${top.map(x=>{const p=des?x.v/des:0; return `<div class="bar-row"><div class="top"><b>${esc(x.c.nome)}</b><span>${brl(x.v)} <span class="muted">${pct(p)}</span></span></div><div class="track"><div class="fill" style="width:${p*100}%;background:var(--despesa)"></div></div></div>`}).join("")}</div>`:`<div class="empty">Nada por aqui ainda.</div>`}
    </div>
    <div class="card"><h2>Receitas x despesas</h2><div class="chart-box"><canvas id="ch1"></canvas></div></div>
    <div class="card"><h2>Saldo acumulado</h2><div class="chart-box"><canvas id="ch2"></canvas></div></div>
  </div>`;
  bindChips(v=>{S.mes=v; render();});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const css=getComputedStyle(document.documentElement), c=n=>css.getPropertyValue(n).trim();
  Chart.defaults.font.family="Manrope, system-ui, sans-serif"; Chart.defaults.color=c("--muted"); Chart.defaults.borderColor=c("--line");
  const money={callback:v=>v>=1000||v<=-1000?(v/1000).toLocaleString("pt-BR")+" mil":v};
  const tt={callbacks:{label:x=>`${x.dataset.label}: ${brl(x.raw)}`}};
  S.charts.push(new Chart($("#ch1"),{type:"bar",data:{labels:M3,datasets:[
    {label:"Receitas",data:A.tipoMes.receita.slice(1),backgroundColor:c("--receita"),borderRadius:4},
    {label:"Despesas",data:A.tipoMes.despesa.slice(1),backgroundColor:c("--despesa"),borderRadius:4},
    {label:"Investido",data:A.tipoMes.investimento.slice(1),backgroundColor:c("--invest"),borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10}},tooltip:tt},scales:{y:{ticks:money},x:{grid:{display:false}}}}}));
  S.charts.push(new Chart($("#ch2"),{type:"line",data:{labels:M3,datasets:[{label:"Saldo",data:A.saldo.slice(1),borderColor:c("--primary"),backgroundColor:"transparent",tension:.3,pointRadius:A.saldo.slice(1).map((_,i)=>i+1===m?5:2),pointBackgroundColor:c("--primary")}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tt},scales:{y:{ticks:money},x:{grid:{display:false}}}}}));
}
function kpi(lab,val,sub,neg,hl){ return `<div class="card kpi ${hl?"hl":""}"><div class="lab">${lab}</div><div class="val ${neg?"neg":""}">${val}</div><div class="sub">${sub}</div></div>`; }

/* ---------- Lançamentos ---------- */
function lancamentos(){
  const fm=S.filtroMes, q=S.busca.toLowerCase();
  let list=S.lanc.filter(l=>{
    if (fm!=null){ const [y,mm]=l.data.split("-").map(Number); if (y!==S.ano||mm!==fm) return false; }
    else { if (Number(l.data.slice(0,4))!==S.ano) return false; }
    if (q){ const c=catById(l.categoria_id), f=formaById(l.forma_id); if (!(`${l.descricao} ${c?.nome||""} ${f?.nome||""} ${l.obs||""}`.toLowerCase().includes(q))) return false; }
    return true;
  });
  const anteriores = S.lanc.filter(l=>Number(l.data.slice(0,4))<S.ano && (idxCobranca(l)+Math.max(1,l.parcelas)-1)>=1);
  const total=sum(list.map(l=>{const c=catById(l.categoria_id); return c&&c.tipo!=="receita"?Number(l.valor):0;}));
  let html=`<div class="head"><h1>Lançamentos</h1><div class="spacer"></div><button class="btn primary" id="novo">${ICON.plus}Novo</button></div>
  ${monthChips(fm,true)}
  <div style="display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap"><input id="busca" placeholder="Buscar por descrição, categoria ou cartão" value="${esc(S.busca)}" style="max-width:360px"><span class="muted small">${list.length} lançamento(s) · gastos ${brl(total)} <span title="Pela data da compra">(pela data da compra)</span></span></div>`;
  if (!list.length) html+=`<div class="card empty">Nenhum lançamento ${fm?`em ${MESES[fm-1]}`:`em ${S.ano}`}. Toque em <b>+</b> para adicionar.</div>`;
  else {
    html+=`<div class="card" style="padding:0"><div class="list">`; let last="";
    for (const l of list){
      if (l.data!==last){ last=l.data; const [y,mm,d]=l.data.split("-"); html+=`<div class="day">${d}/${mm}/${y}</div>`; }
      html+=itemLanc(l);
    }
    html+=`</div></div>`;
  }
  if (anteriores.length) html+=`<h2 style="margin-top:24px">Parcelas de compras de anos anteriores</h2><div class="card" style="padding:0"><div class="list">${anteriores.map(itemLanc).join("")}</div></div>`;
  $("#view").innerHTML=html;
  bindChips(v=>{S.filtroMes=v; render();});
  $("#novo").onclick=()=>editLanc(null);
  const b=$("#busca"); b.oninput=()=>{S.busca=b.value; const pos=b.selectionStart; render(); const nb=$("#busca"); nb.focus(); nb.setSelectionRange(pos,pos);};
  $("#view").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>editLanc(S.lanc.find(l=>l.id===Number(el.dataset.edit))));
}
function itemLanc(l){
  const c=catById(l.categoria_id), f=formaById(l.forma_id), n=Math.max(1,l.parcelas), i0=idxCobranca(l);
  const cob = n>1 ? `${n}x de ${brl(l.valor/n)} · 1ª em ${nomeIdx(i0)}` : (f?.tipo==="cartao" ? `fatura de ${nomeIdx(i0)}` : "");
  return `<div class="item" data-edit="${l.id}" style="cursor:pointer"><div class="lead">${badge(f)}<div><div class="t">${esc(l.descricao||c?.nome||"Sem descrição")}</div><div class="m">${esc(c?.nome||"?")} · ${esc(f?.nome||"sem forma")}${cob?" · "+cob:""}</div></div></div><span class="tag ${c?.tipo||""}">${TIPO_LABEL[c?.tipo]||"?"}</span><div class="v ${c?.tipo==="receita"?"":""}">${brl(l.valor)}</div></div>`;
}
function catOptions(sel){ return grupos().map(g=>`<optgroup label="${esc(g)}">${S.cats.filter(c=>c.grupo===g).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nome)}</option>`).join("")}</optgroup>`).join(""); }
function formaOptions(sel){ return `<option value="">—</option><optgroup label="Cartões">${S.formas.filter(f=>f.tipo==="cartao").map(f=>`<option value="${f.id}" ${f.id===sel?"selected":""}>${esc(f.nome)}</option>`).join("")}</optgroup><optgroup label="À vista">${S.formas.filter(f=>f.tipo!=="cartao").map(f=>`<option value="${f.id}" ${f.id===sel?"selected":""}>${esc(f.nome)}</option>`).join("")}</optgroup>`; }
function editLanc(l){
  const isNew=!l; l=l||{data:today(),descricao:"",categoria_id:null,forma_id:null,valor:"",parcelas:1,obs:""};
  const F=$("#dlgForm");
  F.innerHTML=`<h2 style="font-size:18px">${isNew?"Novo lançamento":"Editar lançamento"}</h2>
  <div class="form-grid">
    <label class="f full">Descrição<input id="fDesc" value="${esc(l.descricao)}" placeholder="Ex.: Mercado, Tênis, Uber" autocomplete="off"></label>
    <label class="f">Valor total<input id="fValor" inputmode="decimal" value="${numIn(l.valor)}" placeholder="0,00" required></label>
    <label class="f">Data da compra<input id="fData" type="date" value="${l.data}" required></label>
    <label class="f">Categoria<select id="fCat" required><option value="">Escolha…</option>${catOptions(l.categoria_id)}</select></label>
    <label class="f">Cartão / forma<select id="fForma">${formaOptions(l.forma_id)}</select></label>
    <label class="f" id="fContaWrap">Conta<select id="fConta">${contaOptions(isNew?lastConta():l.conta_id)}</select></label>
    <label class="f">Parcelas<input id="fParc" type="number" min="1" max="60" step="1" value="${l.parcelas}"></label>
    <label class="f">Observação<input id="fObs" value="${esc(l.obs||"")}"></label>
  </div>
  <div class="preview" id="fPrev"></div>
  <div class="actions">${isNew?"":`<button type="button" class="btn danger" id="fDel">${ICON.trash}Excluir</button>`}<div class="spacer"></div><button type="button" class="btn ghost" id="fCancel">Cancelar</button><button type="submit" class="btn primary" value="ok">${ICON.check}Salvar</button></div>`;
  const prev=()=>{ const v=parseNum($("#fValor").value), n=Math.max(1,Number($("#fParc").value)||1), fo=Number($("#fForma").value)||null, d=$("#fData").value;
    const card=formaById(fo)?.tipo==="cartao"; $("#fContaWrap").hidden=card;
    if (!v||!d){ $("#fPrev").textContent="Estorno ou reembolso: use valor negativo na mesma categoria da compra."; return; }
    const i0=idxCobranca({data:d,forma_id:fo}); const ct=contaById(Number($("#fConta").value)), rec=catById(Number($("#fCat").value))?.tipo==="receita";
    const onde = card ? (formaById(fo).conta_id?` A fatura é paga pela conta ${esc(contaById(formaById(fo).conta_id)?.nome||"")}.`:"") : (ct?` ${rec?"Entra na":"Sai da"} conta <b>${esc(ct.nome)}</b>.`:" Não mexe no saldo de nenhuma conta.");
    const terc=catById(Number($("#fCat").value))?.tipo==="terceiros";
    $("#fPrev").innerHTML = (terc?"Gasto de outra pessoa: não entra nas suas despesas. Quando te devolverem, lance com <b>valor negativo</b> nesta categoria, na conta onde o dinheiro entrou.<br>":"") + (n>1 ? `${n} parcelas de <b>${brl(v/n)}</b>, de ${nomeIdx(i0)} a ${nomeIdx(i0+n-1)}.` : `Entra em <b>${nomeIdx(i0)}</b>${card?" (mês da fatura)":""}.`) + onde; };
  ["fValor","fParc","fForma","fData","fConta","fCat"].forEach(id=>$("#"+id).addEventListener("input",prev)); prev();
  $("#fCancel").onclick=()=>$("#dlg").close();
  if (!isNew) $("#fDel").onclick=async()=>{ if ($("#fDel").dataset.sure!=="1"){ $("#fDel").dataset.sure="1"; $("#fDel").innerHTML=ICON.trash+"Confirmar"; return; } const {error}=await sb.from("lancamentos").delete().eq("id",l.id); if (error) return fail(error); S.lanc=S.lanc.filter(x=>x.id!==l.id); $("#dlg").close(); toast("Lançamento excluído"); render(); };
  F.onsubmit=async e=>{
    e.preventDefault();
    const row={data:$("#fData").value, descricao:$("#fDesc").value.trim(), categoria_id:Number($("#fCat").value)||null, forma_id:Number($("#fForma").value)||null, valor:parseNum($("#fValor").value), parcelas:Math.min(60,Math.max(1,Number($("#fParc").value)||1)), obs:$("#fObs").value.trim()||null};
    row.conta_id = formaById(row.forma_id)?.tipo==="cartao" ? null : (Number($("#fConta").value)||null);
    if (row.valor==null) return toast("Informe o valor."); if (!row.categoria_id) return toast("Escolha a categoria.");
    if (row.conta_id) { try{localStorage.setItem("cf.conta",row.conta_id)}catch(e){} }
    const r = isNew ? await sb.from("lancamentos").insert(row).select().single() : await sb.from("lancamentos").update(row).eq("id",l.id).select().single();
    if (r.error) return fail(r.error);
    if (isNew) S.lanc.unshift(r.data); else S.lanc=S.lanc.map(x=>x.id===l.id?r.data:x);
    S.lanc.sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);
    $("#dlg").close(); toast(isNew?"Lançamento salvo":"Lançamento atualizado"); render();
  };
  $("#dlg").showModal(); if (isNew) setTimeout(()=>$("#fValor").focus(),50);
}

/* ---------- Fixos ---------- */
function fixos(){
  const tot = t => sum(S.fixos.filter(f=>catById(f.categoria_id)?.tipo===t).map(f=>Number(f.valor)));
  $("#view").innerHTML=`<div class="head"><h1>Fixos de ${S.ano}</h1><div class="spacer"></div><button class="btn primary" id="novo">${ICON.plus}Novo</button></div>
  <p class="muted" style="margin-top:-8px">Contas que se repetem todo mês. Lance uma vez com o mês de início e de fim, sem precisar repetir em Lançamentos.</p>
  ${S.fixos.length?`<div class="tbl-wrap"><table><thead><tr><th>Descrição</th><th>Categoria</th><th>Forma</th><th class="n">Valor/mês</th><th>Meses</th><th class="n">Total no ano</th></tr></thead><tbody>

/* ---------- Resumo ---------- */
function resumo(){
  const A=agregados(); const rec=sum(A.tipoMes.receita); const modo=S.resModo||"real";
  const O={}; for (const c of S.cats){ O[c.id]=[0]; for (let m=1;m<=12;m++) O[c.id][m]=orcMes(c,m)||0; }
  const tipoO=t=>{ const a=Array(13).fill(0); S.cats.filter(c=>c.tipo===t).forEach(c=>O[c.id].forEach((v,i)=>{ if(i) a[i]+=v; })); return a; };
  const oRec=tipoO("receita"), oDes=tipoO("despesa"), oInv=tipoO("investimento"), oSob=oRec.map((v,i)=>v-oDes[i]-oInv[i]);
  const val=(real,orc)=> modo==="real"?real : modo==="orc"?orc : orc-real;
  const fmtC=(v,cls="")=>`<td class="n ${cls} ${v<-0.004?"neg":""} ${Math.abs(v)<0.005?"zero":""}">${Math.abs(v)<0.005?"–":brl(v)}</td>`;
  const linha=(lab,ra,oa,cls="")=>{ const arr=ra.map((v,i)=>val(v,oa[i])); return `<tr class="${cls}"><td class="first">${lab}</td>${arr.slice(1).map(v=>fmtC(v)).join("")}<td class="n">${brl(sum(arr.slice(1)))}</td><td class="n">${modo==="real"&&rec?pct(sum(ra)/rec):""}</td></tr>`; };
  let body="";
  body+=linha("Receitas",A.tipoMes.receita,oRec)+linha("Despesas",A.tipoMes.despesa,oDes)+linha("Investimentos",A.tipoMes.investimento,oInv)+linha("Sobrou no mês",A.res,oSob,"tot");
  if (modo==="real") body+=`<tr><td class="first">Saldo acumulado</td>${A.saldo.slice(1).map(v=>fmtC(v)).join("")}<td class="n">${brl(A.saldo[12])}</td><td></td></tr>`;
  if (modo==="real" && A.tipoMes.terceiros.some(v=>v)) body+=linha("Terceiros (gasto por outros − devolvido)",A.tipoMes.terceiros,Array(13).fill(0));
  for (const g of grupos()){
    const cs=S.cats.filter(c=>c.grupo===g); if (modo!=="real" && cs.every(c=>c.tipo==="terceiros")) continue;
    const ga=Array(13).fill(0), go=Array(13).fill(0); cs.forEach(c=>{ (A.porCat[c.id]||[]).forEach((v,i)=>ga[i]+=v); O[c.id].forEach((v,i)=>go[i]+=v); });
    const gv=ga.map((v,i)=>val(v,go[i]));
    body+=`<tr class="grp"><td class="first">${esc(g)}</td>${gv.slice(1).map(v=>fmtC(v)).join("")}<td class="n">${brl(sum(gv.slice(1)))}</td><td class="n">${modo==="real"&&rec?pct(sum(ga)/rec):""}</td></tr>`;
    for (const c of cs){ const a=A.porCat[c.id]||Array(13).fill(0);
      let cells="";
      for (let m=1;m<=12;m++){
        const r=a[m]||0, o=O[c.id][m];
        if (modo==="orc"){ const own=(S.orcs||[]).some(x=>x.categoria_id===c.id&&x.mes===m&&x.ano===S.ano); cells+=`<td class="n"><input class="inline-input orc-in ${own?"own":""}" data-c="${c.id}" data-m="${m}" inputmode="decimal" value="${o?numIn(o):""}" placeholder="–" aria-label="Orçamento de ${esc(c.nome)} em ${MESES[m-1]}"></td>`; }
        else if (modo==="dif"){ cells+= c.tipo==="receita" ? fmtC(r-o) : fmtC(o-r); }
        else { const over = c.tipo==="despesa" && orcMes(c,m)!=null && r>o+0.005; cells+=`<td class="n ${over?"over":r?"":"zero"}">${r?brl(r):"–"}</td>`; }
      }
      const tot = modo==="real"?sum(a.slice(1)) : modo==="orc"?sum(O[c.id].slice(1)) : (c.tipo==="receita"?sum(a.slice(1))-sum(O[c.id].slice(1)):sum(O[c.id].slice(1))-sum(a.slice(1)));
      body+=`<tr><td class="first" style="padding-left:22px">${esc(c.nome)}</td>${cells}<td class="n">${brl(tot)}</td><td class="n">${modo==="real"&&rec?pct(sum(a)/rec):""}</td></tr>`; }
  }
  const legenda = modo==="real" ? "Valores no mês em que são pagos. Em vermelho, o mês em que a categoria passou do orçamento."
    : modo==="orc" ? "Quanto você planeja gastar em cada categoria, mês a mês. Toque num valor para mudar. Apague o valor para voltar ao padrão da categoria (em Configurações). Valores em verde foram ajustados só para aquele mês."
    : "Orçado menos gasto. Positivo é o que ainda sobra; em vermelho, o quanto passou. Em receitas, positivo é o que entrou a mais.";
  $("#view").innerHTML=`<div class="head"><h1>Resumo de ${S.ano}</h1><div class="spacer"></div><div class="seg" id="resSeg"><button type="button" data-m="real" aria-pressed="${modo==="real"}">Realizado</button><button type="button" data-m="orc" aria-pressed="${modo==="orc"}">Orçamento</button><button type="button" data-m="dif" aria-pressed="${modo==="dif"}">Diferença</button></div></div>
  <p class="muted" style="margin-top:-8px">${legenda}</p>
  <div class="tbl-wrap" style="max-height:calc(100dvh - 230px)"><table><thead><tr><th class="first">Categoria</th>${M3.map(m=>`<th class="n">${m}</th>`).join("")}<th class="n">Total</th><th class="n">${modo==="real"?"% receita":""}</th></tr></thead><tbody>${body}</tbody></table></div>`;
  $("#resSeg").onclick=e=>{ const b=e.target.closest("button"); if (!b) return; const sc=$(".tbl-wrap"); const top=sc.scrollTop, left=sc.scrollLeft; S.resModo=b.dataset.m; render(); const n=$(".tbl-wrap"); n.scrollTop=top; n.scrollLeft=left; };
  $("#view").querySelectorAll(".orc-in").forEach(inp=>inp.onchange=async()=>{
    const cid=Number(inp.dataset.c), m=Number(inp.dataset.m), v=parseNum(inp.value);
    const ex=(S.orcs||[]).find(x=>x.categoria_id===cid&&x.ano===S.ano&&x.mes===m);
    if (v==null){ if (ex){ const {error}=await sb.from("orcamentos").delete().eq("id",ex.id); if (error) return fail(error); S.orcs=S.orcs.filter(x=>x!==ex); } }
    else { const r=await sb.from("orcamentos").upsert({categoria_id:cid,ano:S.ano,mes:m,valor:v},{onConflict:"categoria_id,ano,mes"}).select().single(); if (r.error) return fail(r.error); S.orcs=(S.orcs||[]).filter(x=>!(x.categoria_id===cid&&x.ano===S.ano&&x.mes===m)).concat(r.data); }
    const sc=$(".tbl-wrap"); const top=sc.scrollTop, left=sc.scrollLeft, next=inp.closest("td")?.nextElementSibling?.querySelector("input");
    toast("Orçamento salvo"); render(); const n=$(".tbl-wrap"); n.scrollTop=top; n.scrollLeft=left;
  });
}

const contaById = id => S.contas.find(c=>c.id===id);
function corConta(c){ if (c.cor) return c.cor; const f=S.formas.find(f=>f.conta_id===c.id); if (f) return corForma(f); return PALETA[(S.contas.indexOf(c)+4)%PALETA.length]; }
function contaBadge(c,sm){ return badge({nome:c.nome,cor:corConta(c),tipo:"conta"},sm); }
function contaOptions(sel,vazio){ return `<option value="">${vazio||"Nenhuma (dinheiro)"}</option>`+S.contas.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nome)}</option>`).join(""); }
function lastConta(){ try{ const v=Number(localStorage.getItem("cf.conta")); return contaById(v)?v:null; }catch(e){ return null; } }
const pad2=n=>String(n).padStart(2,"0");
function ymdClamp(y,m,d){ const last=new Date(Date.UTC(y,m,0)).getUTCDate(); return `${y}-${pad2(m)}-${pad2(Math.min(d,last))}`; }
function addMeses(s,k){ const [y,m,d]=s.split("-").map(Number); const t=y*12+(m-1)+k; return ymdClamp(Math.floor(t/12), t%12+1, d); }
function diaAntes(s){ const [y,m,d]=s.split("-").map(Number); const t=new Date(Date.UTC(y,m-1,d-1)); return `${t.getUTCFullYear()}-${pad2(t.getUTCMonth()+1)}-${pad2(t.getUTCDate())}`; }
const dBR = s => s.split("-").reverse().join("/");
const r2 = v => Math.round(v*100)/100;

/* tudo que entra e sai de cada conta: lançamentos à vista, fixos, faturas pagas e transferências */
function eventosContas(){
  const ev=[], fat=new Map();
  const addFat=(fid,abs,v)=>{ const k=fid+"|"+abs; if(!fat.has(k)) fat.set(k,{fid,abs,total:0,n:0}); const o=fat.get(k); o.total+=v; o.n++; };
  for (const l of S.lanc){
    const c=catById(l.categoria_id); if (!c) continue; const f=formaById(l.forma_id);
    const n=Math.max(1,l.parcelas||1), v=Number(l.valor)/n, sg=c.tipo==="receita"?1:-1;
    if (f?.tipo==="cartao"){ if (c.tipo!=="receita"){ const a0=absCobranca(l); for (let k=0;k<n;k++) addFat(f.id,a0+k,v); } }
    else if (l.conta_id){ for (let k=0;k<n;k++) ev.push({conta:l.conta_id,data:addMeses(l.data,k),valor:sg*v,desc:(l.descricao||c.nome)+(n>1?` (${k+1}/${n})`:""),sub:c.nome+(f?" · "+f.nome:""),tipo:"lanc",ref:l}); }
  }
  for (const x of S.fixosAll){
    const c=catById(x.categoria_id); if (!c) continue; const f=formaById(x.forma_id); const sg=c.tipo==="receita"?1:-1;
    for (let m=x.mes_inicio;m<=x.mes_fim;m++){
      if (f?.tipo==="cartao"){ if (c.tipo!=="receita") addFat(f.id, x.ano*12+m-1, Number(x.valor)); }
      else if (x.conta_id) ev.push({conta:x.conta_id,data:ymdClamp(x.ano,m,x.dia||5),valor:sg*Number(x.valor),desc:x.descricao,sub:"Fixo · "+c.nome,tipo:"fixo",ref:x});
    }
  }
  for (const o of fat.values()){
    const f=formaById(o.fid); if (!f?.conta_id) continue; const y=Math.floor(o.abs/12), m=o.abs%12+1;
    ev.push({conta:f.conta_id,data:ymdClamp(y,m,f.vencimento||10),valor:-o.total,desc:`Fatura ${f.nome}`,sub:`${M3[m-1]}/${y} · ${o.n} ${o.n>1?"itens":"item"}${f.vencimento?"":" · vencimento dia 10 (ajuste em Configurações)"}`,tipo:"fatura",ref:f,y,m});
  }
  for (const t of S.transf){
    ev.push({conta:t.de_conta_id,data:t.data,valor:-Number(t.valor),desc:`Transferência para ${contaById(t.para_conta_id)?.nome||"?"}`,sub:t.descricao||"Transferência",tipo:"transf",ref:t});
    ev.push({conta:t.para_conta_id,data:t.data,valor:Number(t.valor),desc:`Transferência de ${contaById(t.de_conta_id)?.nome||"?"}`,sub:t.descricao||"Transferência",tipo:"transf",ref:t});
  }
  ev.sort((a,b)=>a.data.localeCompare(b.data)||(a.valor-b.valor));
  return ev;
}
/* ponto de partida: última conciliação até a data (ou o saldo inicial da conta) */
function ancora(conta,data,estrito){
  let best = (conta.data_inicial && conta.data_inicial<=data) ? {data:conta.data_inicial,saldo:Number(conta.saldo_inicial),conc:null} : {data:"0000-00-00",saldo:0,conc:null,vazio:true};
  for (const c of S.concs){
    if (c.conta_id!==conta.id) continue;
    if (estrito ? !(c.data<data) : !(c.data<=data)) continue;
    if (c.data>best.data || (c.data===best.data && (!best.conc || c.id>best.conc.id))) best={data:c.data,saldo:Number(c.saldo_banco),conc:c};
  }
  return best;
}
function saldoEm(conta,data,EV,estrito){ const a=ancora(conta,data,estrito); let s=a.saldo; for (const e of EV) if (e.conta===conta.id && e.data>a.data && e.data<=data) s+=e.valor; return r2(s); }
function ultimaConc(conta){ let u=null; for (const c of S.concs) if (c.conta_id===conta.id && (!u || c.data>u.data || (c.data===u.data&&c.id>u.id))) u=c; return u; }

function contas(){
  if (!S.contas.length){ $("#view").innerHTML=`<div class="head"><h1>Contas</h1></div><div class="card empty">Nenhuma conta cadastrada. Adicione em <button class="link" data-go="config">Configurações</button>.</div>`; document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go)); return; }
  const EV=eventosContas(), hoje=today(), [hy,hm]=hoje.split("-").map(Number), fimMes=ymdClamp(hy,hm,31);
  if (!contaById(S.contaSel)) S.contaSel=S.contas[0].id;
  const sel=contaById(S.contaSel);
  if (S.mesExt==null) S.mesExt = hy===S.ano ? hm : 1;
  const tot=sum(S.contas.map(c=>saldoEm(c,hoje,EV)));
  const devem=r2(sum(S.lanc.filter(l=>catById(l.categoria_id)?.tipo==="terceiros").map(l=>Number(l.valor))) + sum(S.fixosAll.filter(f=>catById(f.categoria_id)?.tipo==="terceiros").map(f=>Number(f.valor)*(f.mes_fim-f.mes_inicio+1))));
  const semConta=S.formas.filter(f=>f.tipo==="cartao"&&!f.conta_id);
  const semContaL=S.lanc.filter(l=>Number(l.data.slice(0,4))===S.ano && formaById(l.forma_id)?.tipo!=="cartao" && !l.conta_id).length;
  const cards=S.contas.map(c=>{ const sh=saldoEm(c,hoje,EV), pv=saldoEm(c,fimMes,EV), u=ultimaConc(c); const d=u?r2(u.saldo_banco-u.saldo_app):null;
    const st = (!u && !c.data_inicial) ? `<span class="muted">Toque em Conciliar e informe o saldo de hoje para começar</span>` : !u ? `<span class="muted">Ainda não conciliada</span>` : Math.abs(d)<0.005 ? `<span class="ok">Conciliada em ${dBR(u.data)} · bateu</span>` : `<span class="neg">Conciliada em ${dBR(u.data)} · diferença de ${brl(d)}</span>`;
    return `<div class="card acc" data-acc="${c.id}" aria-pressed="${c.id===sel.id}" role="button" tabindex="0"><div class="who-f">${contaBadge(c)}<b>${esc(c.nome)}</b></div><div class="val ${sh<0?"neg":""}">${brl(sh)}</div><div class="st muted">Previsto no fim do mês: ${brl(pv)}</div><div class="st">${st}</div><div><button class="btn" data-conc="${c.id}" style="margin-top:4px">${ICON.check}Conciliar</button></div></div>`; }).join("");

  // extrato do mês
  const m=S.mesExt, ini=`${S.ano}-${pad2(m)}-01`, fim=ymdClamp(S.ano,m,31);
  let s=saldoEm(sel,diaAntes(ini),EV);
  const rows=[...EV.filter(e=>e.conta===sel.id && e.data>=ini && e.data<=fim && (!sel.data_inicial || e.data>sel.data_inicial)).map(e=>({...e,k:0})),
              ...S.concs.filter(c=>c.conta_id===sel.id && c.data>=ini && c.data<=fim).map(c=>({tipo:"conc",data:c.data,ref:c,k:1}))]
             .sort((a,b)=>a.data.localeCompare(b.data)||a.k-b.k||(a.ref.id||0)-(b.ref.id||0));
  const inicioConta = !!sel.data_inicial && sel.data_inicial>=ini && sel.data_inicial<=fim;
  let ext=`<div class="day">Saldo em ${dBR(diaAntes(ini))}: <b>${brl(s)}</b>${inicioConta?` · saldo informado em ${dBR(sel.data_inicial)}: ${brl(sel.saldo_inicial)}`:""}</div>`;
  if (inicioConta) s=Number(sel.saldo_inicial);
  for (const e of rows){
    if (e.tipo==="conc"){ const c=e.ref, d=r2(c.saldo_banco-c.saldo_app); s=Number(c.saldo_banco);
      ext+=`<div class="item conc ${Math.abs(d)<0.005?"":"bad"}"><div><div class="t">Conciliação ${dBR(c.data)}</div><div class="m">No app ${brl(c.saldo_app)} · no banco ${brl(c.saldo_banco)}${Math.abs(d)<0.005?" · bateu":` · diferença ${brl(d)}`}${c.obs?" · "+esc(c.obs):""}</div></div><div class="v"></div><div class="sal"><b>${brl(s)}</b></div></div>`; continue; }
    s=r2(s+e.valor); const fut=e.data>hoje;
    ext+=`<div class="item ${fut?"fut":""}" data-ev="${e.tipo}" data-id="${e.ref.id}" ${e.tipo==="fatura"?`data-m="${e.m}" data-y="${e.y}"`:""} style="cursor:pointer"><div><div class="t">${esc(e.desc)}</div><div class="m">${dBR(e.data)} · ${esc(e.sub)}${fut?" · previsto":""}</div></div><div class="v ${e.valor>0?"pos":""}">${e.valor>0?"+":""}${brl(e.valor)}</div><div class="sal">${brl(s)}</div></div>`;
  }
  if (!rows.length) ext+=`<div class="empty">Nenhuma movimentação em ${MESES[m-1]}.</div>`;
  const hist=S.concs.filter(c=>c.conta_id===sel.id).slice().sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id);

  $("#view").innerHTML=`<div class="head"><h1>Contas</h1><div class="spacer"></div><button class="btn" id="btTransf">${ICON.swap}Transferir</button></div>
  <p class="muted" style="margin-top:-8px">Saldo hoje em todas as contas: <b class="${tot<0?"neg":""}">${brl(tot)}</b>${devem>0.005?` · Te devem: <b>${brl(devem)}</b>`:""}</p>
  ${semConta.length?`<div class="alert">As faturas de ${semConta.map(f=>esc(f.nome)).join(", ")} não saem de nenhuma conta. Escolha a conta que paga em <button class="link" data-go="config">Configurações</button>.</div>`:""}
  ${semContaL?`<div class="alert">${semContaL} lançamento(s) à vista de ${S.ano} estão sem conta e não entram nos saldos. Abra o lançamento e escolha a conta.</div>`:""}
  <div class="grid g-acc">${cards}</div>
  <div class="head" style="margin-top:24px;margin-bottom:8px"><h2 style="margin:0">Extrato · ${esc(sel.nome)}</h2></div>
  ${monthChips(m,false)}
  <div class="card ext" style="padding:0;margin-top:12px"><div class="list">${ext}</div></div>
  <p class="muted small" style="margin-top:8px">Faturas de cartão aparecem no dia do vencimento. Toque num item para editar.</p>
  ${hist.length?`<h2 style="margin-top:24px">Conciliações · ${esc(sel.nome)}</h2><div class="tbl-wrap"><table><thead><tr><th>Data</th><th class="n">No app</th><th class="n">No banco</th><th class="n">Diferença</th><th></th></tr></thead><tbody>${hist.map(c=>{const d=r2(c.saldo_banco-c.saldo_app); return `<tr><td>${dBR(c.data)}</td><td class="n">${brl(c.saldo_app)}</td><td class="n">${brl(c.saldo_banco)}</td><td class="n ${Math.abs(d)<0.005?"ok":"neg"}">${Math.abs(d)<0.005?"bateu":brl(d)}</td><td><button class="icon-btn" data-delconc="${c.id}" title="Excluir" aria-label="Excluir">${ICON.trash}</button></td></tr>`}).join("")}</tbody></table></div>`:""}`;

  bindChips(v=>{S.mesExt=v; render();});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  $("#view").querySelectorAll("[data-acc]").forEach(el=>{ el.onclick=e=>{ if (e.target.closest("[data-conc]")) return; S.contaSel=Number(el.dataset.acc); render(); }; el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); el.click(); } }; });
  $("#view").querySelectorAll("[data-conc]").forEach(b=>b.onclick=()=>conciliar(contaById(Number(b.dataset.conc))));
  $("#btTransf").onclick=()=>editTransf(null);
  $("#view").querySelectorAll("[data-ev]").forEach(el=>el.onclick=()=>{ const t=el.dataset.ev, id=Number(el.dataset.id);
    if (t==="lanc") editLanc(S.lanc.find(x=>x.id===id));
    else if (t==="fixo") editFixo(S.fixosAll.find(x=>x.id===id));
    else if (t==="transf") editTransf(S.transf.find(x=>x.id===id));
    else if (t==="fatura"){ if (Number(el.dataset.y)===S.ano){ S.mes=Number(el.dataset.m); go("cartoes"); } } });
  $("#view").querySelectorAll("[data-delconc]").forEach(b=>b.onclick=async()=>{ if (b.dataset.sure!=="1"){ b.dataset.sure="1"; b.style.color="var(--danger)"; toast("Toque de novo para excluir a conciliação"); return; } const id=Number(b.dataset.delconc); const {error}=await sb.from("conciliacoes").delete().eq("id",id); if (error) return fail(error); S.concs=S.concs.filter(x=>x.id!==id); toast("Conciliação excluída"); render(); });
}

function conciliar(conta){
  const EV=eventosContas();
  $("#dlgForm").innerHTML=`<h2 style="font-size:18px">Conciliar conta</h2>
  <p class="muted small" style="margin-top:-6px">Abra o app do banco, veja o saldo e digite aqui. O app compara com o que ele calculou.</p>
  <div class="form-grid">
    <label class="f">Conta<select id="kConta">${S.contas.map(c=>`<option value="${c.id}" ${c.id===conta.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
    <label class="f">Saldo no fim do dia<input id="kData" type="date" value="${today()}" required></label>
    <label class="f full">Saldo no banco<input id="kBanco" inputmode="decimal" placeholder="0,00" required></label>
    <label class="f full">Observação<input id="kObs" placeholder="Opcional"></label>
  </div>
  <div class="preview" id="kPrev"></div>
  <div class="actions"><div class="spacer"></div><button type="button" class="btn ghost" id="kCancel">Cancelar</button><button type="submit" class="btn primary">${ICON.check}Conciliar</button></div>`;
  const calc=()=>{ const c=contaById(Number($("#kConta").value)), d=$("#kData").value; if (!c||!d) return null; return saldoEm(c,d,EV,true); };
  const prev=()=>{ const app=calc(), b=parseNum($("#kBanco").value); if (app==null){ $("#kPrev").textContent=""; return; }
    const c0=contaById(Number($("#kConta").value)); if (ancora(c0,$("#kData").value,true).vazio){ $("#kPrev").innerHTML="Primeira conciliação desta conta: o saldo do banco vira o ponto de partida e o app calcula daí em diante."; return; }
    let h=`Saldo calculado pelo app: <b>${brl(app)}</b>`;
    if (b!=null){ const d=r2(b-app); h+= Math.abs(d)<0.005 ? `<br><span class="ok"><b>Bateu.</b></span>` : `<br><span class="neg"><b>Diferença de ${brl(d)}</b></span> ${d>0?"(o banco tem mais que o app: falta lançar alguma entrada, ou algum gasto foi lançado a mais)":"(o banco tem menos que o app: falta lançar algum gasto ou tarifa)"}.<br>Ao conciliar, a diferença fica registrada e o saldo da conta passa a seguir o valor do banco a partir dessa data.`; }
    $("#kPrev").innerHTML=h; };
  ["kConta","kData","kBanco"].forEach(id=>$("#"+id).addEventListener("input",prev)); prev();
  $("#kCancel").onclick=()=>$("#dlg").close();
  $("#dlgForm").onsubmit=async e=>{ e.preventDefault(); const b=parseNum($("#kBanco").value), app=calc(); if (b==null) return toast("Informe o saldo do banco."); if (app==null) return toast("Informe a data.");
    const row={conta_id:Number($("#kConta").value),data:$("#kData").value,saldo_banco:b,saldo_app:app,obs:$("#kObs").value.trim()||null};
    const r=await sb.from("conciliacoes").insert(row).select().single(); if (r.error) return fail(r.error);
    S.concs.push(r.data); S.contaSel=row.conta_id; const d=r2(b-app); $("#dlg").close(); toast(Math.abs(d)<0.005?"Conciliado: bateu":"Conciliado com diferença de "+brl(d)); render(); };
  $("#dlg").showModal(); setTimeout(()=>$("#kBanco").focus(),50);
}

function editTransf(t){
  const isNew=!t; t=t||{data:today(),de_conta_id:S.contaSel||S.contas[0]?.id,para_conta_id:null,valor:"",descricao:""};
  const opts=sel=>S.contas.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nome)}</option>`).join("");
  $("#dlgForm").innerHTML=`<h2 style="font-size:18px">${isNew?"Transferir entre contas":"Editar transferência"}</h2>
  <div class="form-grid">
    <label class="f">De<select id="tDe">${opts(t.de_conta_id)}</select></label>
    <label class="f">Para<select id="tPara"><option value="">Escolha…</option>${opts(t.para_conta_id)}</select></label>
    <label class="f">Valor<input id="tValor" inputmode="decimal" value="${numIn(t.valor)}" placeholder="0,00" required></label>
    <label class="f">Data<input id="tData" type="date" value="${t.data}" required></label>
    <label class="f full">Descrição<input id="tDesc" value="${esc(t.descricao||"")}" placeholder="Opcional"></label>
  </div>
  <div class="actions">${isNew?"":`<button type="button" class="btn danger" id="tDel">${ICON.trash}Excluir</button>`}<div class="spacer"></div><button type="button" class="btn ghost" id="tCancel">Cancelar</button><button type="submit" class="btn primary">${ICON.check}Salvar</button></div>`;
  $("#tCancel").onclick=()=>$("#dlg").close();
  if (!isNew) $("#tDel").onclick=async()=>{ if ($("#tDel").dataset.sure!=="1"){ $("#tDel").dataset.sure="1"; $("#tDel").innerHTML=ICON.trash+"Confirmar"; return; } const {error}=await sb.from("transferencias").delete().eq("id",t.id); if (error) return fail(error); S.transf=S.transf.filter(x=>x.id!==t.id); $("#dlg").close(); toast("Transferência excluída"); render(); };
  $("#dlgForm").onsubmit=async e=>{ e.preventDefault();
    const row={de_conta_id:Number($("#tDe").value),para_conta_id:Number($("#tPara").value)||null,valor:parseNum($("#tValor").value),data:$("#tData").value,descricao:$("#tDesc").value.trim()||null};
    if (!row.para_conta_id) return toast("Escolha a conta de destino."); if (row.para_conta_id===row.de_conta_id) return toast("Escolha contas diferentes."); if (!row.valor||row.valor<=0) return toast("Informe um valor maior que zero.");
    const r=isNew?await sb.from("transferencias").insert(row).select().single():await sb.from("transferencias").update(row).eq("id",t.id).select().single(); if (r.error) return fail(r.error);
    if (isNew) S.transf.push(r.data); else S.transf=S.transf.map(x=>x.id===t.id?r.data:x);
    $("#dlg").close(); toast("Transferência salva"); render(); };
  $("#dlg").showModal();
}

/* ---------- Configurações ---------- */
function config(){
  const gopts=g=>grupos().map(x=>`<option ${x===g?"selected":""}>${esc(x)}</option>`).join("");
  $("#view").innerHTML=`<div class="head"><h1>Configurações</h1></div>

    <label class="f">Saldo em conta no início de ${S.ano}<input id="cSaldo" inputmode="decimal" value="${numIn(S.cfg.saldo_inicial)}"></label>
  </div></div>
  <h2>Contas</h2>
  <p class="muted small" style="margin-top:-6px">Opcional: o saldo de cada conta numa data. O jeito mais fácil é ir na aba <b>Contas</b>, tocar em <b>Conciliar</b> e digitar o saldo de hoje. A partir daí o app calcula sozinho.</p>
  <div class="tbl-wrap" style="margin-bottom:8px"><table><thead><tr><th>Cor</th><th>Conta</th><th>Saldo em</th><th>Saldo nessa data</th><th></th></tr></thead><tbody>
  ${S.contas.map(c=>`<tr data-id="${c.id}" data-t="contas"><td><span class="who-f">${contaBadge(c)}<input type="color" data-k="cor" value="${corConta(c)}" aria-label="Cor de ${esc(c.nome)}"></span></td><td><input class="inline-input w-l" data-k="nome" value="${esc(c.nome)}"></td><td><input class="inline-input" style="width:150px" type="date" data-k="data_inicial" value="${c.data_inicial||""}"></td><td><input class="inline-input" data-k="saldo_inicial" inputmode="decimal" value="${numIn(c.saldo_inicial)}"></td><td><button class="icon-btn" data-del title="Excluir" aria-label="Excluir">${ICON.trash}</button></td></tr>`).join("")}

  <div class="tbl-wrap" style="margin-bottom:8px"><table><thead><tr><th>Cor</th><th>Nome</th><th>Tipo</th><th>Fechamento</th><th>Vencimento</th><th>Limite</th><th>Conta que paga</th><th></th></tr></thead><tbody>

  <td><input class="inline-input w-s" data-k="fechamento" type="number" min="1" max="31" value="${f.fechamento??""}" ${f.tipo!=="cartao"?"disabled":""} placeholder="dia"></td><td><input class="inline-input w-s" data-k="vencimento" type="number" min="1" max="31" value="${f.vencimento??""}" ${f.tipo!=="cartao"?"disabled":""} placeholder="dia"></td>
  <td><input class="inline-input" data-k="limite" inputmode="decimal" value="${numIn(f.limite)}" ${f.tipo!=="cartao"?"disabled":""}></td><td><select class="inline-input" style="width:140px" data-k="conta_id" ${f.tipo!=="cartao"?"disabled":""}>${contaOptions(f.conta_id,"—")}</select></td><td><button class="icon-btn" data-del title="Excluir" aria-label="Excluir">${ICON.trash}</button></td></tr>`).join("")}

  $("#view").querySelectorAll('input[type=color]').forEach(inp=>inp.oninput=()=>{ const b=inp.previousElementSibling; b.style.setProperty("--c",inp.value); b.classList.toggle("dark",claro(inp.value)); });
  $("#cSaldo").onchange=async e=>{ const v=parseNum(e.target.value)??0; const {error}=await sb.from("config").update({saldo_inicial:v}).eq("user_id",S.user.id); if (error) return fail(error); S.cfg.saldo_inicial=v; toast("Saldo inicial salvo"); };
  $("#view").querySelectorAll("tr[data-id] [data-k]").forEach(inp=>inp.onchange=async()=>{
    const tr=inp.closest("tr"), t=tr.dataset.t, id=Number(tr.dataset.id), k=inp.dataset.k; let v=inp.value.trim();

    if (k==="nome"&&!v) return toast("O nome não pode ficar vazio.");
    const {data,error}=await sb.from(t).update({[k]:v}).eq("id",id).select().single(); if (error) return fail(error);
    const arr=t==="formas"?S.formas:t==="contas"?S.contas:S.cats; const i=arr.findIndex(x=>x.id===id); arr[i]=data; toast("Salvo"); if ((t!=="categorias"&&["tipo","cor","nome","conta_id"].includes(k))||k==="tipo"||k==="grupo") render();
  });
  $("#view").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const tr=b.closest("tr"), t=tr.dataset.t, id=Number(tr.dataset.id);

    if (b.dataset.sure!=="1"){ b.dataset.sure="1"; b.style.color="var(--danger)"; toast(t==="contas"?"Toque de novo para excluir. Transferências e conciliações dessa conta também serão apagadas.":"Toque de novo para excluir"); return; }
    const {error}=await sb.from(t).delete().eq("id",id); if (error) return fail(error.code==="23503"?{message:"ela está em uso em outro ano."}:error);
    if (t==="formas") S.formas=S.formas.filter(x=>x.id!==id); else if (t==="contas"){ S.contas=S.contas.filter(x=>x.id!==id); S.transf=S.transf.filter(x=>x.de_conta_id!==id&&x.para_conta_id!==id); S.concs=S.concs.filter(x=>x.conta_id!==id); S.formas.forEach(f=>{if(f.conta_id===id)f.conta_id=null}); S.lanc.forEach(l=>{if(l.conta_id===id)l.conta_id=null}); S.fixosAll.forEach(l=>{if(l.conta_id===id)l.conta_id=null}); } else S.cats=S.cats.filter(x=>x.id!==id); render();
  });
  $("#addForma").onclick=async()=>{ let n="Novo cartão",i=2; while(S.formas.some(f=>f.nome===n)) n="Novo cartão "+(i++); const r=await sb.from("formas").insert({nome:n,tipo:"cartao",ordem:S.formas.length+1}).select().single(); if (r.error) return fail(r.error); S.formas.push(r.data); render(); };
  $("#addConta").onclick=async()=>{ let n="Nova conta",i=2; while(S.contas.some(c=>c.nome===n)) n="Nova conta "+(i++); const r=await sb.from("contas").insert({nome:n,ordem:S.contas.length+1}).select().single(); if (r.error) return fail(r.error); S.contas.push(r.data); render(); };
  $("#addCat").onclick=async()=>{ let n="Nova categoria",i=2; while(S.cats.some(c=>c.nome===n)) n="Nova categoria "+(i++); const last=S.cats[S.cats.length-1]; const r=await sb.from("categorias").insert({nome:n,grupo:"Outros",tipo:"despesa",ordem:(last?.ordem||0)+1}).select().single(); if (r.error) return fail(r.error); S.cats.push(r.data); render(); };
}

const ICON={
